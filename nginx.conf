server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API → sopir-api (backend Node)
    # resolver do Docker + variável: resolução dinâmica por request,
    # para o nginx não morrer se a API estiver reiniciando
    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $sopir_api http://sopir-api:3000;
        proxy_pass $sopir_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SPA fallback — todas as rotas servem o index.html
    # nunca cacheado: precisa sempre referenciar os hashes de build mais recentes
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|svg|png|jpg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
